# Mapper configuration for IAG Issues backfill.
#
# All column names live here, never in code (enterprise exports change
# header casing/naming and yaml is the seam to react without redeploying).

# =============================================================================
# Source workbook (the IAG file holds source data + all three taxonomies)
# =============================================================================
source:
  file_pattern: "IAG Issues*.xlsx"
  sheet_name: "Archer Search Report"
  id_col: "Issue ID"
  title_col: "Issue Title"
  # Text columns concatenated (in order) to form each row's input text for
  # similarity scoring. Add or remove as needed.
  text_cols:
    - "Issue Description"
    - "Root Cause Description"

  # Columns whose cells may contain multiple newline-separated values.
  # Each such row is exploded into one row per value (cartesian product if
  # more than one explode column has multiple values). All other cells are
  # copied verbatim. Output workbook will have more rows than input.
  explode_on:
    - "Risk Level 2"

# =============================================================================
# Targets: each entry describes one column to fill on the source sheet.
#
# Required keys per target:
#   target_col            — column on source sheet to fill (only when blank)
#   taxonomy_sheet        — sheet name in the same workbook
#   taxonomy_parent_col   — parent column in the taxonomy
#   taxonomy_child_col    — column whose value is written to target_col
#   taxonomy_def_col      — definition/description column folded into vector text
#
# Optional keys:
#   source_constraint_col — column on source sheet whose value must equal the
#                           taxonomy_parent_col value for a row to be a candidate.
#                           Omit (or null) for unconstrained matching.
#   parent_fill_col       — column on source sheet to also fill with the
#                           taxonomy_parent_col of the chosen child. Omit if
#                           the parent isn't written back.
# =============================================================================
targets:
  - name: "Issue Subtheme"
    target_col: "Issue Subtheme"
    parent_fill_col: "Issue Theme"
    taxonomy_sheet: "Theme Taxonomy"
    taxonomy_parent_col: "Issue Theme"
    taxonomy_child_col: "Issue Subtheme"
    taxonomy_def_col: "Definition"

  - name: "Root Cause Subtheme"
    target_col: "Root Cause Subtheme"
    taxonomy_sheet: "Root Cause Taxonomy"
    taxonomy_parent_col: "Root Cause Theme"
    taxonomy_child_col: "Root Cause Subtheme"
    taxonomy_def_col: "Description"
    source_constraint_col: "Root Cause"

  - name: "Risk Level 4"
    target_col: "Risk Level 4"
    taxonomy_sheet: "L4 Risk Taxonomy"
    taxonomy_parent_col: "Risk Level 2"
    taxonomy_child_col: "Risk Level 4"
    taxonomy_def_col: "L4 Definition"
    source_constraint_col: "Risk Level 2"

# =============================================================================
# spaCy model. en_core_web_lg is more accurate; en_core_web_md is the small
# fallback. Download with `python -m spacy download <model>`.
# =============================================================================
spacy_model: "en_core_web_lg"
